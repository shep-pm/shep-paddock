name: Release
# Tags the commit, creates the GitHub release, and uploads to crates.io. Runs
# on every push to main and does nothing unless Cargo.toml names a version
# crates.io does not have, so merging the release pull request is what
# publishes.
#
# No test gate here: the `main` ruleset's required checks keep an untested
# commit off main. Delete that ruleset and this publishes whatever lands.
#
# Off until the maintainer turns releases on; see release-plz-pr.yml.

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-release
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.RELEASES == 'on'
    # An environment, so a required reviewer can be added between merging and
    # spending a version number. Inert until one is configured.
    environment: crates-io
    # Read by the `binaries` job below. Empty unless this run released.
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      # One package in this repository, so the first release is the only one.
      tag: ${{ steps.release.outputs.releases_created == 'true' && fromJSON(steps.release.outputs.releases)[0].tag || '' }}
    steps:
      # Pinned by commit, as in release-plz-pr.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Builds the bare binary for every target shep ships for, attaches each to
  # the release release-plz just made, and opens the pull request on
  # shep-pm/shep that sets this dog's index row. A job here rather than a
  # `release: published` workflow so a run is tied to the release that made it.
  binaries:
    name: Prebuilt binaries
    needs: release-plz-release
    if: needs.release-plz-release.outputs.released == 'true'
    # What dog-release.yml asks of its caller.
    permissions:
      contents: write
      actions: read
    # Pinned by commit: it runs with this job's write access and the index
    # token. Move the sha when you choose to.
    uses: shep-pm/shep/.github/workflows/dog-release.yml@89952a434c44a0842b9f957f7173714beafa1fe9
    with:
      package: shep-paddock
      tag: ${{ needs.release-plz-release.outputs.tag }}
    secrets:
      index-token: ${{ secrets.SHEP_INDEX_TOKEN }}
