name: Release
# Tags the commit, creates the GitHub release, and uploads to crates.io. Runs
# on every push to main and does nothing unless Cargo.toml names a version
# crates.io does not have, so merging the release pull request is what
# publishes.
#
# No test gate here: the `main` ruleset's required checks keep an untested
# commit off main. Delete that ruleset and this publishes whatever lands.
#
# Off until the maintainer turns releases on; see release-plz-pr.yml.

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-release
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.RELEASES == 'on'
    # An environment, so a required reviewer can be added between merging and
    # spending a version number. Inert until one is configured.
    environment: crates-io
    steps:
      # Pinned by commit, as in release-plz-pr.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
