# Subjects carry `ci(deps):` and `chore(deps):` so commits.yml accepts them.
# release-plz skips both types, so a bump alone makes no changelog entry and
# the release workflow's empty-changelog guard holds that release open.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
