[package]
name = "shep-paddock"
version = "0.1.0"
edition = "2024"
# shep's MSRV. A dog or client that needs a newer compiler than the shepherd
# it works with is a bad example.
rust-version = "1.88"
description = "A shep dog that leases one host's GPU and RAM to model servers and jobs, behind a single endpoint"
repository = "https://github.com/shep-pm/shep-paddock"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["shep"]
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]

[dependencies]
shep-client = { version = "0.12", default-features = false, features = ["schema"] }
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "signal", "sync", "io-util", "process"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
# Constant-time comparison of client keys.
subtle = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
# Only to give tests a scratch directory of their own.
tempfile = { version = "3", default-features = false }

[features]
# Option: build the tier that drives a real shepherd. Needs a `shep` binary in $SHEP_BIN.
integration = []

[[test]]
name = "integration"
required-features = ["integration"]

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Debug info dominates a debug build, and a dependency's is never what is
# being debugged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size, not speed: shep measured thin LTO with one codegen unit at a quarter
# off its binary and nothing off its runtime. Not `strip` (a profiler names
# frames by symbol) and not `panic = "abort"` (shep-client re-raises a
# panicked task with `resume_unwind`).
[profile.release]
lto = "thin"
codegen-units = 1
